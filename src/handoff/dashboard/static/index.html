<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>handoff mission control</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">⇄</span> handoff <small>mission control</small></div>
  <div class="meta">
    <span id="graph-name" class="graph-name"></span>
    <span id="status" class="status" role="status">connecting</span>
    <button id="replay" type="button">Replay last events</button>
  </div>
</header>
<nav class="tabs" aria-label="Views">
  <button type="button" data-view="orchestration" aria-current="true">Orchestration</button>
  <button type="button" data-view="handoff">Context handoff</button>
  <button type="button" data-view="graph">Context graph</button>
  <button type="button" data-view="tracks">Tracks</button>
</nav>
<div class="layout">
  <main>
    <section id="view-orchestration" class="view">
      <svg id="orch" viewBox="0 0 800 460" role="img" aria-label="Sessions and the messages, needs and reads between them"></svg>
      <p class="hint">Each circle is a Claude Code session. Lines carry what moves between them:
        <span class="key message">messages</span>, <span class="key read">reads of each other's work</span>,
        <span class="key need">needs</span>. Moving dots are events happening now.</p>
    </section>
    <section id="view-handoff" class="view" hidden>
      <div id="handoff"></div>
    </section>
    <section id="view-graph" class="view" hidden>
      <div class="graph-bar">
        <button type="button" data-mode="work" aria-pressed="true">Work graph</button>
        <button type="button" data-mode="concepts" aria-pressed="false">Concept graph</button>
        <span id="graph-count" class="graph-count"></span>
      </div>
      <div class="canvas-wrap">
        <canvas id="graph" aria-label="The shared graph, drawn live"></canvas>
        <div id="tip" class="tip" hidden></div>
      </div>
      <div id="legend" class="legend"></div>
    </section>
    <section id="view-tracks" class="view" hidden>
      <div id="tracks"></div>
    </section>
  </main>
  <aside class="feed">
    <h2>Live feed</h2>
    <ol id="ticker"></ol>
  </aside>
</div>
<script src="/common.js"></script>
<script src="/orchestration.js"></script>
<script src="/handoff.js"></script>
<script src="/graphview.js"></script>
<script src="/tracks.js"></script>
<script src="/app.js"></script>
</body>
</html>
