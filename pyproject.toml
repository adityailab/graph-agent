[project]
name = "handoff"
version = "0.1.0"
description = "A shared FalkorDB context graph for parallel Claude Code sessions"
requires-python = ">=3.12"
dependencies = ["falkordb>=1.8,<2"]

[dependency-groups]
dev = ["pytest>=9.1", "mypy>=2.4", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handoff"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff also formats code blocks in Markdown; the plan's snippets are not project code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["falkordb.*", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
