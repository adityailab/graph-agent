services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    ports:
      # Bound to this machine only: the graph holds prompts and has no password.
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  falkordb-data:
